{% load static %}

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}پنل کاربری - حمل و نقل{% endblock %}</title>
    
    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    
    <!-- استایل پایه پنل -->
    <link rel="stylesheet" href="{% static 'css/base_panel_style.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="panel-wrapper">
        
        <!-- Sidebar (راست) -->
        <aside class="sidebar">
            <div class="sidebar-brand">
                <h4>Cargo<span>Admin</span></h4>
            </div>
            
            <nav class="sidebar-nav">
                <a href="{% url 'forwarder_panel:dashboard' %}">
                    <i class="fas fa-chart-line"></i> داشبورد
                </a>
                <a href="{% url 'forwarder_panel:order_list' %}"><i class="fas fa-box"></i> مدیریت سفارشات</a>
                <a href="{% url 'forwarder_panel:report_page' %}">گزارشات </a>
                <a href="{% url 'forwarder_panel:rate_list' %}"><i class="fas fa-tags"></i> مدیریت نرخ‌ها</a>
                <a href="{% url 'forwarder_panel:branch_list' %}"><i class="fas fa-tags"></i> مدیریت شعب</a>
                <a href="{% url 'forwarder_panel:staff_list' %}"><i class="fas fa-tags"></i> مدیریت کارمندان</a>
                <a href="#"><i class="fas fa-cog"></i> تنظیمات</a>
                <a href="#"><i class="fas fa-headset"></i> پشتیبانی</a>
                <a href="{% url 'forwarder_panel:documents' %}"><i class="fas fa-file-alt"></i> مدارک و مستندات</a>

            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/base_panel_script.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
