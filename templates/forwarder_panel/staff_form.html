{% extends 'forwarder_panel/base.html' %}

{% block content %}
<div class="container-fluid py-4">
    <div class="mb-4">
        <h2 class="h4">افزودن کارمند جدید</h2>
    </div>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post" action="{% url 'forwarder_panel:staff_create' %}">
                {% csrf_token %}
                
                <div class="row">
                    {% for field in form %}
                    <div class="col-md-6 mb-3">
                        <label for="{{ field.id_for_label }}" class="form-label">
                            {{ field.label }}
                        </label>
                        {{ field }}
                        
                        {% if field.errors %}
                            <div class="text-danger mt-1 small">
                                {{ field.errors|striptags }}
                            </div>
                        {% endif %}
                    </div>
                    {% endfor %}
                </div>

                <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-success">ثبت کارمند</button>
                    <a href="{% url 'forwarder_panel:staff_list' %}" class="btn btn-secondary">انصراف</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
