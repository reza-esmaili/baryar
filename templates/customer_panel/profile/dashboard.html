{% extends 'customer_panel/profile/profile_base.html' %}

{% block profile_content %}

<div class="content-card">

    <div class="content-header">
        <h2>داشبورد</h2>
    </div>

    <div class="stats-grid">

        <div class="stat-card">
            <h3>{{ orders_count }}</h3>
            <p>کل سفارشات</p>
        </div>

        <div class="stat-card">
            <h3>{{ pending_orders }}</h3>
            <p>سفارشات در انتظار</p>
        </div>

        <div class="stat-card">
            <h3>{{ documents_count }}</h3>
            <p>مدارک ثبت شده</p>
        </div>

    </div>

</div>

{% endblock %}
